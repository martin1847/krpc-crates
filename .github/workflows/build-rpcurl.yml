name: Build rpcurl

# Reusable build matrix — the SINGLE SOURCE of the 4-target build for both
# ci.yml (PR validation, package=false) and release-rpcurl.yml (tag release,
# package=true). Edit the matrix/steps here and both callers stay in sync.

on:
  workflow_call:
    inputs:
      package:
        description: "Package the binary into dist/*.zip and upload as an artifact"
        type: boolean
        default: false
      tag_name:
        description: "Release tag (used only when package=true); empty = derive from ref_name"
        type: string
        default: ""
      ref:
        description: "Git ref to check out; empty = the triggering ref"
        type: string
        default: ""

env:
  CARGO_TERM_COLOR: always
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: rpcurl
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: rpcurl
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: rpcurl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: rpcurl.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install cmake nasm ninja

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake musl-tools nasm ninja-build

      - name: Install Windows build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm llvm -y
          cargo install --force --locked bindgen-cli

      - name: Build
        if: runner.os != 'Windows'
        run: cargo build --locked -p rpcurl --release --target ${{ matrix.target }}

      - name: Build Windows
        if: runner.os == 'Windows'
        env:
          AWS_LC_SYS_EXTERNAL_BINDGEN: "1"
        run: cargo build --locked -p rpcurl --release --target ${{ matrix.target }}

      - name: Package
        if: ${{ inputs.package && runner.os != 'Windows' }}
        shell: bash
        run: |
          set -euo pipefail
          tag_name="${{ inputs.tag_name || github.ref_name }}"
          version="${tag_name#v}"
          asset="rpcurl-${version}-${{ matrix.target }}"
          mkdir -p "dist/${asset}"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${asset}/"
          (cd dist && zip -r "${asset}.zip" "${asset}")

      - name: Package Windows
        if: ${{ inputs.package && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $tagName = "${{ inputs.tag_name || github.ref_name }}"
          $version = $tagName.TrimStart("v")
          $asset = "rpcurl-$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$asset" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/$asset/"
          Compress-Archive -Path "dist/$asset" -DestinationPath "dist/$asset.zip" -Force

      - name: Upload artifact
        if: ${{ inputs.package }}
        uses: actions/upload-artifact@v4
        with:
          name: rpcurl-${{ matrix.target }}
          path: dist/*.zip
          if-no-files-found: error
