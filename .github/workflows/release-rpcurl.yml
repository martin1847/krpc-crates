name: Release rpcurl

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing tag to release, for example v1.0.0-rc.1"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: rpcurl
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: rpcurl
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: rpcurl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: rpcurl.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install cmake nasm ninja

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake musl-tools nasm ninja-build

      - name: Install Windows build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm llvm -y
          cargo install --force --locked bindgen-cli

      - name: Build
        if: runner.os != 'Windows'
        run: cargo build --locked -p rpcurl --release --target ${{ matrix.target }}

      - name: Build Windows
        if: runner.os == 'Windows'
        env:
          AWS_LC_SYS_EXTERNAL_BINDGEN: "1"
        run: cargo build --locked -p rpcurl --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          tag_name="${{ inputs.tag_name || github.ref_name }}"
          version="${tag_name#v}"
          asset="rpcurl-${version}-${{ matrix.target }}"
          mkdir -p "dist/${asset}"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${asset}/"
          (cd dist && zip -r "${asset}.zip" "${asset}")

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpcurl-${{ matrix.target }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Prepare release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          tag_name="${{ inputs.tag_name || github.ref_name }}"
          version="${tag_name#v}"
          prerelease=false
          if [[ "${version}" == *-rc.* || "${version}" == *-alpha.* || "${version}" == *-beta.* ]]; then
            prerelease=true
          fi
          (cd dist && sha256sum *.zip > SHA256SUMS)
          echo "tag_name=${tag_name}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: rpcurl ${{ steps.meta.outputs.version }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/SHA256SUMS
