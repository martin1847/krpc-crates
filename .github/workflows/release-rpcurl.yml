name: Release rpcurl

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing tag to release, for example v1.0.0-rc.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  # 4-target build + package via the shared reusable workflow (package=true so it
  # zips and uploads the per-target artifacts consumed by the release job below).
  build:
    uses: ./.github/workflows/build-rpcurl.yml
    with:
      package: true
      tag_name: ${{ inputs.tag_name || '' }}
      ref: ${{ inputs.tag_name || github.ref }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Prepare release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          tag_name="${{ inputs.tag_name || github.ref_name }}"
          version="${tag_name#v}"
          prerelease=false
          if [[ "${version}" == *-rc.* || "${version}" == *-alpha.* || "${version}" == *-beta.* ]]; then
            prerelease=true
          fi
          (cd dist && sha256sum ./*.zip > SHA256SUMS)
          {
            echo "tag_name=${tag_name}"
            echo "version=${version}"
            echo "prerelease=${prerelease}"
          } >> "${GITHUB_OUTPUT}"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: rpcurl ${{ steps.meta.outputs.version }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/SHA256SUMS
